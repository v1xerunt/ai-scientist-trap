[provider]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
chat_endpoint = "/chat/completions"
api_key_env = "OPENROUTER_API_KEY"
http_referer_env = "OPENROUTER_HTTP_REFERER"
app_title_env = "OPENROUTER_APP_TITLE"
timeout_seconds = 180

[model]
default = "deepseek/deepseek-v4-flash"
candidates = [
  "deepseek/deepseek-v4-flash",
  "qwen/qwen3.7-plus"
]
temperature = 0.4

[run]
run_root = "runs/agent_runs"
copy_dataset = true
execute_code = false
save_raw_response = true
max_code_repairs = 3
analysis_sufficiency_review = true
max_sufficiency_reviews = 2
max_supplemental_analyses = 3
author_paradigm = "iterative_coding"

[limits]
dataset_preview_rows = 25
codebook_max_variables = 80
